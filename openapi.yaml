openapi: 3.0.3
info:
  title: SentiBot AI Help-Desk API
  description: Hybrid Emotion Classification & Generative AI Help-Desk API Surface
  version: 1.0.0
  contact:
    name: AI Experts (Team Leader: Aryan Sharma)
    email: aryansharmacse354@gmail.com
paths:
  /:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API status online
  /api/chat:
    post:
      summary: Process chat input through emotion classifier, guardrails, and LLM orchestrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: "I am having billing problems with my account!"
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                session_id:
                  type: string
                  example: "session-101"
                locale:
                  type: string
                  example: "EN-US"
      responses:
        '200':
          description: Structured reply with sentiment confidence scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  sentiment:
                    type: string
                    example: "anger"
                  confidence:
                    type: number
                    example: 0.88
                  intentMatched:
                    type: boolean
                  source:
                    type: string
                    example: "llm_orchestrator"
