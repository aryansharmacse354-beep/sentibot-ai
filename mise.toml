[tools]
node = "20.17.0"
python = "3.12.0"

[tasks.dev]
description = "Start Next.js frontend and FastAPI backend"
run = "npm run dev"

[tasks.lint]
description = "Execute ESLint and TypeScript checks"
run = "npm run lint && npx tsc --noEmit"

[tasks.test]
description = "Run Docker Compose CI testing sandbox"
run = "docker-compose -f docker-compose.test.yml up --exit-code-from test-runner"
